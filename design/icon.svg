<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050916"/>
      <stop offset="1" stop-color="#0B1224"/>
    </linearGradient>
    <linearGradient id="blueSplat" x1="0" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D3FB8"/>
    </linearGradient>
    <linearGradient id="redSplat" x1="1024" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF5B4E"/>
      <stop offset="1" stop-color="#C4231C"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE3F5"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- diagonal color halves, echoing the sport/manga mood board -->
  <polygon points="0,0 460,0 250,1024 0,1024" fill="url(#blueSplat)" opacity="0.9"/>
  <polygon points="1024,0 620,0 830,1024 1024,1024" fill="url(#redSplat)" opacity="0.9"/>

  <!-- central collector card -->
  <g transform="translate(512 512)">
    <rect x="-190" y="-260" width="380" height="520" rx="36" fill="url(#cardFace)" stroke="#050916" stroke-width="10"/>
    <rect x="-160" y="-224" width="320" height="320" rx="18" fill="#0B1224"/>
    <!-- scan viewfinder corners -->
    <g stroke="#3B82F6" stroke-width="14" stroke-linecap="round" fill="none">
      <path d="M -150 -214 L -150 -170 M -150 -214 L -106 -214"/>
      <path d="M 150 -214 L 150 -170 M 150 -214 L 106 -214"/>
      <path d="M -150 76 L -150 32 M -150 76 L -106 76"/>
      <path d="M 150 76 L 150 32 M 150 76 L 106 76"/>
    </g>
    <!-- star mark -->
    <path d="M0 -70 L21 -22 L73 -16 L34 18 L46 70 L0 42 L-46 70 L-34 18 L-73 -16 L-21 -22 Z" fill="#F97316"/>
    <!-- collector lines -->
    <rect x="-140" y="150" width="280" height="18" rx="9" fill="#8B93B8"/>
    <rect x="-140" y="188" width="180" height="14" rx="7" fill="#4B5578"/>
  </g>
</svg>
